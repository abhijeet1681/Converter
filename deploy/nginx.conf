# Nginx reverse proxy for ConvertHub (replace example.com with your domain)
# Get free HTTPS with:  sudo certbot --nginx -d example.com -d www.example.com
server {
    listen 80;
    server_name example.com www.example.com;

    # Must be >= MAX_UPLOAD_MB in .env
    client_max_body_size 110m;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml application/xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
